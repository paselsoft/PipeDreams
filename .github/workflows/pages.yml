# Verifica il gioco a ogni push e, se tutto passa, lo pubblica su GitHub Pages
# (solo dal branch predefinito). Richiede Settings → Pages → Source: "GitHub Actions".
name: Verifica e pubblica

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Una sola pubblicazione alla volta; quelle in coda non annullano quella in corso
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sintassi dei file JavaScript
        run: for f in *.js tools/*.js; do node --check "$f"; done

      - name: Tutti i livelli sono risolvibili
        run: node tools/validate-levels.js

      - name: La simulazione coincide con bash e GNU coreutils
        run: node tools/check-shell.js 100

  pubblica:
    needs: verifica
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # I permessi del job sostituiscono quelli globali: contents serve al checkout (repo privato)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Il sito contiene solo i file del gioco e dell'editor, non gli strumenti di sviluppo
      - name: Prepara il sito
        run: |
          mkdir _site
          cp *.html *.css *.js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
