# Verifica il gioco a ogni push e, se tutto passa, lo pubblica su GitHub Pages
# (solo dal branch predefinito). Richiede Settings → Pages → Source: "GitHub Actions".
name: Verifica e pubblica

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Una sola pubblicazione alla volta; quelle in coda non annullano quella in corso
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sintassi dei file JavaScript
        run: for f in *.js tools/*.js; do node --check "$f"; done

      - name: Tutti i livelli sono risolvibili
        run: node tools/validate-levels.js

      - name: La simulazione coincide con bash e GNU coreutils
        run: node tools/check-shell.js 100

      - name: Le sfide del giorno del prossimo anno sono valide
        run: node tools/check-daily.js 366

      - name: L'interprete della modalità terminale rilegge ogni comando
        run: node tools/check-terminal.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installa Playwright e Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Test nel browser (gioco, editor, manuale, laboratorio, sfida, terminale)
        run: node tests/e2e/run.js

  pubblica:
    needs: [verifica, browser]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # I permessi del job sostituiscono quelli globali: contents serve al checkout (repo privato)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Il sito contiene solo i file del gioco e dell'editor, non gli strumenti di sviluppo
      - name: Prepara il sito
        run: |
          mkdir _site
          cp *.html *.css *.js *.webmanifest *.png _site/
          # Numero di build visibile nel gioco: commit e data della pubblicazione
          build="$(git rev-parse --short HEAD) del $(git log -1 --format=%cd --date=format:%d/%m/%Y)"
          sed -i "s|^const APP_BUILD = \"sviluppo\";|const APP_BUILD = \"$build\";|" _site/version.js
          grep -q "const APP_BUILD = \"$build\";" _site/version.js
          # Un sw.js diverso a ogni pubblicazione: il browser installa la nuova versione e il gioco lo segnala
          sha=$(git rev-parse --short HEAD)
          sed -i "s|^const CACHE = \"pipedreams-v1\";|const CACHE = \"pipedreams-$sha\";|" _site/sw.js
          grep -q "const CACHE = \"pipedreams-$sha\";" _site/sw.js

      - uses: actions/configure-pages@v5

      # Un nome diverso per ogni tentativo: con "Re-run jobs" GitHub troverebbe due archivi
      # "github-pages" nello stesso run e la pubblicazione fallirebbe
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
